name: Evaluation workflow tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evaluation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-evaluation.txt
      - run: python -m pip install -r requirements-evaluation.txt
      - run: python -B -m pytest tests -p no:cacheprovider -W error::FutureWarning
